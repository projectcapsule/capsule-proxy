name: Setup development tools
description: Install the locked Devbox environment and restore Go and ko caches.
runs:
  using: composite
  steps:
    # Keep Nix bootstrap versioned instead of using Devbox's floating experimental installer.
    - name: Install Nix
      shell: bash
      run: | # zizmor: ignore[github-env] Only the fixed official Nix profile path is added, with no repository or action input.
        nix_install_dir=$(mktemp -d)
        trap 'rm -rf "$nix_install_dir"' EXIT
        curl --fail --silent --show-error --location \
          --retry 5 --retry-all-errors --retry-max-time 120 --connect-timeout 15 --max-time 60 \
          https://releases.nixos.org/nix/nix-2.35.4/install --output "$nix_install_dir/install"
        printf '%s\n' \
          'experimental-features = ca-derivations fetch-closure nix-command flakes' \
          "trusted-users = root $(id -un)" > "$nix_install_dir/nix.conf"
        sh "$nix_install_dir/install" --daemon --yes --no-channel-add \
          --nix-extra-conf-file "$nix_install_dir/nix.conf"
        /nix/var/nix/profiles/default/bin/nix --version
        printf '%s\n' /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
    - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
      with:
        devbox-version: 0.18.4
        enable-cache: 'true'
        disable-nix-access-token: 'true'
        skip-nix-installation: 'true'
    - name: Verify tool lockfile
      shell: bash
      run: git diff --exit-code -- devbox.lock
    - name: Locate Go caches
      id: cache
      shell: bash
      run: | # zizmor: ignore[github-env] The KOCACHE value uses only runner-owned RUNNER_TEMP, with no pull request input.
        printf 'build=%s\nmodules=%s\n' "$(devbox run -- go env GOCACHE)" "$(devbox run -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        printf 'KOCACHE=%s/ko-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.cache.outputs.build }}
          ${{ steps.cache.outputs.modules }}
          ${{ runner.temp }}/ko-cache
        key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles('devbox.lock', '**/go.sum', '.ko.yaml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-tools-
