name: Test charts
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "main"
    paths:
      - '.github/configs/**'
      - '.github/workflows/helm-*.yml'
      - 'charts/**'
      - 'Taskfile.yml'
      - 'devbox.json'
      - 'devbox.lock'
      - '.github/actions/setup/**'
      - 'api/**'
      - 'internal/**'
      - 'go.*'
      - '*.go'
      - '.ko.yaml'
      - 'e2e/distro/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter-artifacthub:
    runs-on: ubuntu-latest
    container:
      image: artifacthub/ah@sha256:e5d2a2cdef85aac4928e8176ffaad24746c5fe961d64ff6856f7222957095356
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ah lint
        working-directory: ./charts/
        run: ah lint
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint chart
        run: devbox run -- task helm:lint
      - name: Verify generated chart documentation and schema
        run: devbox run -- task helm:verify
      - name: Install and test chart
        run: devbox run -- task helm:test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-test-logs
          path: dist/e2e
          if-no-files-found: ignore
          retention-days: 7
